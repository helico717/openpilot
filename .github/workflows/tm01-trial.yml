name: TM01 parked trial validation
on:
  push:
    branches: [carrot-wip-model_selector-ha]
    paths:
      - 'opendbc_repo/opendbc/car/car.capnp'
      - 'opendbc_repo/opendbc/safety/**'
      - 'panda/board/main.c'
      - 'panda/board/drivers/fdcan.h'
      - 'openpilot/selfdrive/pandad/**'
      - 'openpilot/selfdrive/debug/tm01_trial.py'
      - '.github/workflows/tm01-trial.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m unittest discover -s openpilot/selfdrive/pandad/tests -p test_tm01_trial.py -v
          python -m unittest discover -s openpilot/selfdrive/debug -p test_tm01_trial.py -v
      - name: Cross-compile actual H7 and F4 firmware
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc-arm-none-eabi
          pip install scons scons_compilation_db pycryptodome
          cd panda
          scons --minimal -j4 board/obj/panda_h7.bin.signed board/obj/panda.bin.signed
  pandad:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Set up native openpilot dependencies
        run: ./tools/op.sh setup
      - name: Compile actual Linux pandad and updated cereal schema
        run: |
          source .venv/bin/activate
          scons -j4 openpilot/selfdrive/pandad/pandad
