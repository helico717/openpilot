name: IQ HA upstream refresh

# Keeps the iq-ha companion branch on the current IQpilot release (konn3kt, force-pushed per release). The builder lives in
# helico717/carrot-ha; iq-ha is always its output for the pinned Carrot donor and one IQpilot commit.
# Pushes only after the candidate tests pass; IQ.OS changes or broken port patches stop for review.
# Results appear as run annotations (UP_TO_DATE, IDENTICAL, COMMITTED with changed files, or NEEDS_REVIEW).
on:
  schedule:
    - cron: '17 19 * * *'  # 04:17 KST daily
  # Editing this workflow runs a self-check: forced rebuild, never pushed (expect IDENTICAL).
  push:
    branches: [carrot-wip]
    paths: ['.github/workflows/iq_ha_upstream_refresh.yml']
  workflow_dispatch:
    inputs:
      force:
        description: 'Rebuild even when the IQpilot release is unchanged (expect IDENTICAL)'
        type: boolean
        default: false
      dry_run:
        description: 'Build and test only; never push'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: iq-ha-upstream-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out iq-ha
        uses: actions/checkout@v6
        with:
          ref: iq-ha
          path: candidate
          fetch-depth: 1
      - name: Check out the builder (helico717/carrot-ha main)
        uses: actions/checkout@v6
        with:
          repository: helico717/carrot-ha
          ref: main
          path: builder
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install aiohttp av
      - name: Rebuild on the IQpilot release and test
        id: refresh
        env:
          FORCE: ${{ (inputs.force || github.event_name == 'push') && '--force' || '' }}
        run: python -u builder/scripts/refresh_iq_ha.py --candidate candidate $FORCE
      - name: Push to iq-ha
        if: steps.refresh.outputs.result == 'COMMITTED' && inputs.dry_run != true && github.event_name != 'push'
        working-directory: candidate
        run: git push origin HEAD:refs/heads/iq-ha
      - name: Record a validation run on the new commit
        if: steps.refresh.outputs.result == 'COMMITTED' && inputs.dry_run != true && github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run iq-ha-validation.yml --ref iq-ha -R "$GITHUB_REPOSITORY"
