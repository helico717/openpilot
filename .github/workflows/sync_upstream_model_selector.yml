name: Auto Sync Upstream Model Selector

on:
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout custom branch
        uses: actions/checkout@v4
        with:
          ref: carrot-wip-model_selector-ha
          fetch-depth: 0
          token: ${{ secrets.SYNC_PAT || github.token }}

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch and Merge Upstream
        env:
          SYNC_WORKFLOWS: ${{ secrets.SYNC_PAT != '' }}
        run: |
          git remote add upstream https://github.com/ajouatom/openpilot.git || true
          git fetch upstream happymaj11r/carrot-wip-model_selector

          if git merge-base --is-ancestor upstream/happymaj11r/carrot-wip-model_selector HEAD; then
            echo "Already up-to-date with upstream happymaj11r/carrot-wip-model_selector."
            exit 0
          fi

          # Keep this fork's CI configuration, including workflow additions/deletions.
          # GITHUB_TOKEN cannot push upstream workflow changes. Save the exact
          # pre-merge tree rather than relying on HEAD~1 after an amend.
          base_commit=$(git rev-parse HEAD)
          git merge upstream/happymaj11r/carrot-wip-model_selector --no-edit -m "chore: auto-sync upstream happymaj11r/carrot-wip-model_selector"

          if [ "$SYNC_WORKFLOWS" != "true" ]; then
            # No-overlay also removes added workflows and restores deleted ones.
            git restore --source="$base_commit" --staged --worktree --no-overlay -- .github/workflows/
            if ! git diff --cached --quiet; then
              git commit --amend --no-edit
            fi
            git diff --exit-code "$base_commit" HEAD -- .github/workflows/
            echo "Preserved fork workflows for GITHUB_TOKEN; upstream code merged."
          else
            echo "Syncing upstream workflows using SYNC_PAT (requires workflow write permission)."
          fi

          # Report unrelated push failures directly rather than treating every
          # failure as a workflow permission error.
          git push origin carrot-wip-model_selector-ha
