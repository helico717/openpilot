name: Auto Sync Upstream Model Selector

on:
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-model-selector-ha
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout custom branch
        uses: actions/checkout@v4
        with:
          ref: carrot-wip-model_selector-ha
          fetch-depth: 0
          token: ${{ secrets.SYNC_PAT || github.token }}

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch and Merge Upstream
        env:
          SYNC_WORKFLOWS: ${{ secrets.SYNC_PAT != '' }}
        run: |
          git remote add upstream https://github.com/ajouatom/openpilot.git || true
          git fetch upstream happymaj11r/carrot-wip-model_selector

          bash .github/scripts/sync_upstream_model_selector.sh
